pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // sherpa-onnx (Offline-Stimme Pocket TTS) gibt es nur über JitPack – nur dieses Paket von dort holen.
        maven {
            url 'https://jitpack.io'
            content { includeGroup 'com.github.k2-fsa.sherpa-onnx' }
        }
    }
}
rootProject.name = 'Jarvis'
include ':app'
include ':wakeword'
