plugins {
    id 'com.android.application'
}

def runNumber = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
// Zweig, aus dem gebaut wurde – die Test-App fragt damit auf GitHub nach einer neueren Version.
def branchName = (System.getenv('GITHUB_REF_NAME') ?: '').replaceAll('[^A-Za-z0-9._/-]', '')

// Arbeitszweige bauen mit „-PtestApp“ eine eigene Test-App („Jarvis Test“). Sie hat eine andere
// Paket-ID, installiert sich NEBEN die normale Jarvis-App und hat eigene Einstellungen und eigenes
// Gedächtnis – die normale App wird dabei weder überschrieben noch verändert.
def testApp = project.hasProperty('testApp')

// Offline-Stimme (Pocket TTS) über sherpa-onnx, Fassung mit FEST EINGEBAUTER ONNX Runtime. Die normale Fassung
// teilt sich libonnxruntime.so mit onnxruntime-android (Wachwort) – die Symbole sind aber versioniert
// (VERS_1.28.2 gegen VERS_1.28.0), eine der beiden findet dann OrtGetApiBase nicht (Gerätetest Build 97).
// Quelle: unveränderliches GitHub-Release von k2-fsa, Prüfsumme fest. Einmal geladen, liegt es in .sherpa/.
def sherpaAar = file("${rootDir}/.sherpa/sherpa-onnx-static-link-onnxruntime-2.0.1.aar")
def sherpaSha = '07e042d97f3a6bd5b7fe74d4eef0513dc01a714b16c15a903250095aba43a575'
def sha256 = { File f ->
    def md = java.security.MessageDigest.getInstance('SHA-256')
    f.withInputStream { is -> byte[] buf = new byte[65536]; int n; while ((n = is.read(buf)) > 0) md.update(buf, 0, n) }
    md.digest().encodeHex().toString()
}
if (!sherpaAar.isFile() || sha256(sherpaAar) != sherpaSha) {
    sherpaAar.parentFile.mkdirs()
    def tmp = new File(sherpaAar.path + '.part')
    def url = 'https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-static-link-onnxruntime-2.0.1.aar'
    logger.lifecycle("Lade sherpa-onnx: $url")
    new URL(url).withInputStream { input -> tmp.withOutputStream { it << input } }
    def got = sha256(tmp)
    if (got != sherpaSha) {
        tmp.delete()
        throw new GradleException("sherpa-onnx: falsche Prüfsumme $got")
    }
    tmp.renameTo(sherpaAar)
}

android {
    namespace 'de.art.jarvis'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId testApp ? 'de.art.jarvis.test' : 'de.art.jarvis'
        minSdk 30
        targetSdk 35
        versionCode runNumber
        versionName testApp ? "1.0.${runNumber}-test" : "1.0.${runNumber}"
        resValue 'string', 'app_name', testApp ? 'Jarvis Test' : 'Jarvis'
        resValue 'string', 'listen_name', testApp ? 'Jarvis Test sprechen' : 'Jarvis sprechen'
        buildConfigField 'boolean', 'TEST_APP', testApp ? 'true' : 'false'
        buildConfigField 'String', 'BRANCH', "\"${branchName}\""
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                targets 'jarvis_llm'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    // Fester Schlüssel, damit jede neue APK sich über die alte installieren lässt.
    signingConfigs {
        jarvis {
            storeFile file('jarvis.keystore')
            storePassword 'jarvis-sideload'
            keyAlias 'jarvis'
            keyPassword 'jarvis-sideload'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.jarvis
            // Handy und CI-Emulator (x86_64) reichen. Mit allen vier Architekturen war die Debug-APK durch
            // sherpa-onnx 200 MB groß, und das Installieren legte den Emulator lahm (Build 100: Launcher hing).
            ndk {
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
        release {
            signingConfig signingConfigs.jarvis
            minifyEnabled false
            // Nur 64-Bit-ARM (Galaxy S24 Ultra) – hält die APK trotz Wachwort-Engine klein.
            // Die Debug-Variante hat zusätzlich x86_64, damit sie im Emulator für die Vorschaubilder läuft.
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // Die Wachwort-Modelle unkomprimiert lassen (schneller geladen).
        noCompress 'onnx'
    }

    packaging {
        jniLibs {
            // Nur für x86 (32 bit, ohne Bedeutung) bringt sherpa-onnx eine eigene libonnxruntime.so mit; arm64 und
            // x86_64 haben die Runtime fest eingebaut. Die von onnxruntime-android gewinnt.
            pickFirsts += ['**/libonnxruntime.so']
            // Native Bibliotheken gepackt in der APK: rund 50 MB ONNX Runtime und sherpa-onnx machen jedes Update
            // sonst entsprechend größer. Kostet einmal Entpacken bei der Installation.
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':wakeword')
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.28.0'
    // Offline-Stimme: Kyutai Pocket TTS über sherpa-onnx (Apache 2.0), siehe PocketVoice und oben.
    implementation files(sherpaAar)
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    // Echte JSON-Klassen für die Tests – Android liefert dort sonst nur leere Platzhalter.
    testImplementation 'org.json:json:20240303'
}
