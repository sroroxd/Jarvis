plugins {
    id 'com.android.application'
}

def runNumber = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')

android {
    namespace 'de.art.jarvis'
    compileSdk 35

    defaultConfig {
        applicationId 'de.art.jarvis'
        minSdk 30
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"
        // Nur 64-Bit-ARM (Galaxy S24 Ultra) – hält die APK trotz Wachwort-Engine klein.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Fester Schlüssel, damit jede neue APK sich über die alte installieren lässt.
    signingConfigs {
        jarvis {
            storeFile file('jarvis.keystore')
            storePassword 'jarvis-sideload'
            keyAlias 'jarvis'
            keyPassword 'jarvis-sideload'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.jarvis
        }
        release {
            signingConfig signingConfigs.jarvis
            minifyEnabled false
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // Die Wachwort-Modelle unkomprimiert lassen (schneller geladen).
        noCompress 'onnx'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':wakeword')
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.13.0'
    testImplementation 'junit:junit:4.13.2'
}
