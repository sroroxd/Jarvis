name: Aufräumen

# Von Hand starten: GitHub → Actions → „Aufräumen“ → Run workflow (Zweig main genügt).
#
# Löscht nur, was nachweislich nicht mehr gebraucht wird – ohne Listen, die jemand pflegen muss:
#   1. Arbeitszweige, deren Commits alle schon in main stecken (main selbst nie),
#   2. Test-Apps „test-<Zweig>“, deren Zweig es nicht mehr gibt,
#   3. ältere normale Apps „v1.0.<Build>“ – die neueste bleibt, sie ist das Ziel des Download-Links.
# Bleiben immer: main, vorschau (Bericht des Gerätetests), die neueste v1.0.x und Test-Apps vorhandener Zweige.
# Ein Zweig mit eigenen, noch nicht übernommenen Commits bleibt stehen (gelbe Warnung im Lauf).
# Erst schauen: „nur_anzeigen“ auf „ja“ – dann wird nichts gelöscht, nur aufgelistet.
# (Bis 8. Nov. stand hier eine feste Liste vom Aufräumen am Morgen – längst abgearbeitet.)
on:
  workflow_dispatch:
    inputs:
      nur_anzeigen:
        description: "Nur anzeigen, nichts löschen (ja/nein)"
        default: "nein"
        required: true

permissions:
  contents: write

jobs:
  aufraeumen:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUR_ANZEIGEN: ${{ inputs.nur_anzeigen }}
    steps:
      - name: Zweige und Releases aufräumen
        run: |
          set -u
          # Direkt über die API mit Statuscode: GitHub antwortet beim Löschen gelegentlich mit
          # HTTP 500/502 (am 4. Nov. siebenmal). Das wird wiederholt – was übrig bleibt, macht den Lauf rot.
          api() { # Methode Pfad [Ausgabedatei]
            curl -s -o "${3:-/dev/null}" -w '%{http_code}' -X "$1" \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GH_REPO/$2"
          }
          weg() { # Beschreibung – im Probelauf nur ansagen
            if [ "$NUR_ANZEIGEN" = "ja" ]; then echo "Würde löschen: $1"; return 1; fi
            return 0
          }
          loesche_release() { # Tag
            weg "Release $1" || return 0
            for versuch in 1 2 3 4 5 6; do
              code=$(api GET "releases/tags/$1" /tmp/release.json)
              if [ "$code" = 200 ]; then
                id=$(jq -r .id /tmp/release.json)
                code=$(api DELETE "releases/$id")
                if [ "$code" != 204 ] && [ "$code" != 404 ]; then
                  echo "  $1: Release löschen → HTTP $code, Versuch $versuch"; sleep $((versuch * 5)); continue
                fi
              elif [ "$code" != 404 ]; then
                echo "  $1: Abfrage → HTTP $code, Versuch $versuch"; sleep $((versuch * 5)); continue
              fi
              code=$(api DELETE "git/refs/tags/$1")
              case "$code" in
                204|404|422) echo "Release weg: $1"; return 0 ;;   # 422 = Tag gibt es schon nicht mehr
                *) echo "  $1: Tag löschen → HTTP $code, Versuch $versuch"; sleep $((versuch * 5)) ;;
              esac
            done
            return 1
          }
          loesche_zweig() { # Zweig – nur, wenn jeder seiner Commits in main steckt
            for versuch in 1 2 3 4 5 6; do
              code=$(api GET "compare/main...$1" /tmp/compare.json)
              if [ "$code" != 200 ]; then
                echo "  $1: Vergleich → HTTP $code, Versuch $versuch"; sleep $((versuch * 5)); continue
              fi
              eigen=$(jq -r .ahead_by /tmp/compare.json)   # Commits im Zweig, die main nicht hat
              if [ "$eigen" != 0 ]; then
                echo "::warning title=Zweig bleibt::$1 hat $eigen Commit(s), die noch nicht in main sind."
                return 0
              fi
              weg "Zweig $1 (vollständig in main)" || return 0
              code=$(api DELETE "git/refs/heads/$1")
              case "$code" in
                204|404|422) echo "Zweig weg: $1 (vollständig in main)"; return 0 ;;
                *) echo "  $1: Zweig löschen → HTTP $code, Versuch $versuch"; sleep $((versuch * 5)) ;;
              esac
            done
            return 1
          }

          fehler=""
          # 1. Zweige, die ganz in main stecken
          for z in $(gh api "repos/$GH_REPO/branches" --paginate --jq '.[].name'); do
            [ "$z" = main ] && continue
            loesche_zweig "$z" || fehler="$fehler $z"
          done
          # 2./3. Releases – nach dem Zweige-Aufräumen, damit Test-Apps eben gelöschter Zweige mit weggehen
          zweige=" $(gh api "repos/$GH_REPO/branches" --paginate --jq '.[].name' | tr '\n' ' ') "
          tags=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name')
          neueste=$(printf '%s\n' $tags | grep -E '^v1\.0\.[0-9]+$' | sort -t. -k3 -n | tail -1)
          echo "Neueste normale App: ${neueste:-keine} – bleibt."
          for t in $tags; do
            case "$t" in
              vorschau) continue ;;
              test-*)
                zweig=${t#test-}
                case "$zweige" in *" $zweig "*) continue ;; esac
                loesche_release "$t" || fehler="$fehler $t" ;;
              v1.0.*)
                [ "$t" = "$neueste" ] && continue
                loesche_release "$t" || fehler="$fehler $t" ;;
            esac
          done
          echo
          echo "Was jetzt noch da ist:"
          gh release list --limit 50
          gh api "repos/$GH_REPO/branches" --jq '.[].name'
          if [ -n "$fehler" ]; then
            echo "::error title=Nicht alles gelöscht::Übrig:$fehler – Meldungen oben lesen, dann ggf. noch einmal starten."
            exit 1
          fi

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "### Nach dem Aufräumen"
            echo
            echo "**Releases**"
            gh release list --limit 50 | awk -F'\t' '{print "- " $3 " (" $1 ")"}'
            echo
            echo "**Zweige**"
            gh api "repos/$GH_REPO/branches" --jq '.[] | "- " + .name'
          } >> "$GITHUB_STEP_SUMMARY"
