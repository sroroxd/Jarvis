name: Jarvis APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Feste Version statt „latest“, damit ein Wechsel des Betriebssystems den Build nicht überraschend bricht.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      # Erst die automatischen Tests, dann die APK. Schlägt ein Test fehl, wird nichts veröffentlicht.
      - name: Tests und APK bauen
        run: |
          set -o pipefail
          if ! gradle --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log; then
            msg=$(grep -E "error:|FAILED|AssertionError|expected|What went wrong" build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build oder Tests fehlgeschlagen::$msg"
            exit 1
          fi

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Jarvis.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Jarvis 1.0.${{ github.run_number }}
          make_latest: true
          files: Jarvis.apk
          body: |
            Jarvis.apk herunterladen und installieren – wird über die vorherige Version installiert.
