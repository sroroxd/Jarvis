name: Jarvis APK bauen

# Jeder Zweig wird gebaut, mit den automatischen Tests geprüft und im Emulator getestet.
#
# Sicherheit (15. Nov. 2026):
#  - Normale Builds brauchen KEINEN API-Schlüssel und stellen keine kostenpflichtigen Anfragen. Die Live-Tests
#    gegen Claude laufen nur noch, wenn jemand den Lauf von Hand startet und „cloud_tests“ ankreuzt.
#  - Die Debug-APK liegt als Artefakt am Lauf („Jarvis-Debug-APK“), signiert mit einem Debug-Schlüssel.
#  - Veröffentlicht (Release, Test-App, Vorschau-Bilder) wird nur, wenn der NEUE Signaturschlüssel als
#    GitHub-Secret hinterlegt ist. Der alte Schlüssel aus dem Repo ist kompromittiert und signiert keine
#    Veröffentlichung mehr allein. Einrichtung und Auswirkungen: docs/SIGNATUR_MIGRATION.md.
on:
  push:
    branches: [ '**' ]
    # Reine Messungen ändern die App nicht – dafür keinen App-Build und keine neue Test-App.
    paths-ignore:
      - '.github/bench/**'
      - '.github/workflows/latenz.yml'
  workflow_dispatch:
    inputs:
      cloud_tests:
        description: 'Kostenpflichtige Anthropic-Live-Tests ausdrücklich ausführen'
        type: boolean
        default: false

# Standard: nur lesen. Schreibrechte bekommen allein die Jobs, die veröffentlichen.
permissions:
  contents: read

jobs:
  build:
    # Feste Version statt „latest“, damit ein Wechsel des Betriebssystems den Build nicht überraschend bricht.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      # „true“, wenn der neue Signaturschlüssel hinterlegt ist – nur dann wird überhaupt etwas veröffentlicht.
      freigabe: ${{ steps.schluessel.outputs.vorhanden }}
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      # Nur das Vorhandensein prüfen – der Schlüssel selbst kommt in diesem Job nie an Gradle oder ein Skript.
      - name: Ist der neue Signaturschlüssel hinterlegt?
        id: schluessel
        env:
          KS: ${{ secrets.JARVIS_NEU_KEYSTORE_BASE64 }}
          PW: ${{ secrets.JARVIS_NEU_KEYSTORE_PASSWORT }}
          ALT: ${{ secrets.JARVIS_ALT_KEYSTORE_PASSWORT }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ] && [ -n "$ALT" ]; then
            echo "vorhanden=true" >> "$GITHUB_OUTPUT"
            echo "Neuer Signaturschlüssel ist hinterlegt – nach bestandenem Test wird veröffentlicht."
          else
            echo "vorhanden=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Keine Veröffentlichung::Der neue Signaturschlüssel fehlt (docs/SIGNATUR_MIGRATION.md). Die Debug-APK liegt als Artefakt am Lauf."
          fi

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      # Erst die automatischen Tests (inkl. Wachwort-Erkennung mit echten Aufnahmen), dann die APKs.
      # main baut die normale App. Jeder andere Zweig baut die separate Test-App („Jarvis Test“),
      # die sich neben die normale App installiert, statt sie zu überschreiben.
      # Die Debug-APK (arm64 + x86_64) läuft im Emulator und auf dem Handy; die Release-APK ist nur arm64 und
      # kommt UNSIGNIERT aus Gradle (signiert wird erst im Job „veroeffentlichen“).
      - name: Tests und APKs bauen
        run: |
          set -o pipefail
          variant=""
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then variant="-PtestApp"; fi
          if ! gradle --no-daemon $variant :wakeword:test testDebugUnitTest assembleRelease assembleDebug 2>&1 | tee build.log; then
            msg=$(grep -E "error:|FAILED|AssertionError|expected|What went wrong" build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build oder Tests fehlgeschlagen::$msg"
            exit 1
          fi

      # Jede APK wird vor der Weitergabe geprüft: richtige Paket-ID, Android-Sicherung aus, Debug gültig signiert
      # und NICHT mit dem kompromittierten Schlüssel, Release ohne Signatur. Schlägt etwas fehl, endet der Lauf.
      - name: APKs prüfen
        run: |
          set -o pipefail
          {
            echo "Build ${GITHUB_RUN_NUMBER}, Zweig ${GITHUB_REF_NAME}, Commit ${GITHUB_SHA}"
            bash scripts/signierung/apk-pruefen.sh app/build/outputs/apk/debug/app-debug.apk debug
            bash scripts/signierung/apk-pruefen.sh app/build/outputs/apk/release/app-release-unsigned.apk unsigniert
          } | tee apk-pruefung.txt
          { echo '### APK-Prüfung'; echo '```'; cat apk-pruefung.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cp app/build/outputs/apk/debug/app-debug.apk "Jarvis-Debug-${GITHUB_RUN_NUMBER}.apk"

      - name: APKs ablegen
        uses: actions/upload-artifact@v4
        with:
          name: apks
          retention-days: 3
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/debug/app-debug.apk

      # Zum Herunterladen für Art: die installierbare Debug-APK samt Prüfbericht (eigene Paket-ID „….debug“,
      # installiert sich neben Jarvis und Jarvis Test). Kein Release – nur am Lauf, nur für Angemeldete.
      - name: Debug-APK zum Herunterladen ablegen
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Debug-APK
          retention-days: 14
          if-no-files-found: error
          path: |
            Jarvis-Debug-${{ github.run_number }}.apk
            apk-pruefung.txt

  geraetetest:
    # Die App im Android-Emulator installieren, starten, bedienen und auf Abstürze und Hänger prüfen.
    needs: build
    permissions:
      contents: write   # nur für die Vorschau-Bilder, und nur wenn veröffentlicht werden darf (siehe unten)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: APKs holen
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks

      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Im Emulator testen
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Kostenpflichtig, deshalb nur bei von Hand gestartetem Lauf mit angekreuztem „cloud_tests“. Normale
          # Push-Builds bekommen keinen Schlüssel; der Gesprächstest wird dann übersprungen, der Rest läuft.
          JARVIS_TESTKEY: ${{ github.event_name == 'workflow_dispatch' && inputs.cloud_tests && secrets.ANTHROPIC_API_KEY || '' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then pkg=de.art.jarvis.debug; else pkg=de.art.jarvis.test.debug; fi; bash .github/scripts/geraetetest.sh "$pkg" "$(find apks -name app-debug.apk | head -1)"

      - name: Ergebnis im Protokoll zeigen
        if: always()
        run: cat shots/geraetetest.txt 2>/dev/null || echo "Kein Bericht – der Emulator kam nicht hoch."

      # Bildschirmfotos und Bericht – auch wenn der Test fehlschlägt (dann erst recht). Immer als Artefakt am Lauf.
      - name: Bilder und Bericht als Artefakt ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geraetetest-bericht
          retention-days: 14
          if-no-files-found: warn
          path: shots/

      # Zusätzlich öffentlich in der Vorab-Version „vorschau“ – nur, wenn veröffentlicht werden darf.
      - name: Bilder und Bericht hochladen
        if: always() && needs.build.outputs.freigabe == 'true'
        # Die Bilder sind Beiwerk: Ein Upload-Problem darf die Veröffentlichung nicht blockieren.
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: vorschau
          name: Gerätetest im Emulator (nicht installieren)
          prerelease: true
          make_latest: false
          files: |
            shots/*.png
            shots/*.txt
            shots/*.wav
          body: |
            Gerätetest vom Arbeitsstand „${{ github.ref_name }}“ (Build ${{ github.run_number }}): Bildschirmfotos,
            Bericht (geraetetest.txt) und Fehlerprotokoll. Keine App zum Installieren.

  veroeffentlichen:
    # Nur wenn Tests UND Gerätetest bestanden sind – und nur mit dem neuen Signaturschlüssel.
    needs: [ build, geraetetest ]
    if: needs.build.outputs.freigabe == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: APKs holen
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks

      # Signiert die unsignierte Release-APK mit dem neuen Schlüssel und einem Rotationsnachweis: Ab Android 13
      # gilt der neue Schlüssel, bestehende Installationen (alter Schlüssel) lassen sich trotzdem aktualisieren.
      # Der alte Schlüssel wird dafür ein letztes Mal gebraucht – nur für diesen Nachweis, nie allein.
      - name: Mit dem neuen Schlüssel signieren und prüfen
        env:
          KS_B64: ${{ secrets.JARVIS_NEU_KEYSTORE_BASE64 }}
          JARVIS_NEW_KS_PASS: ${{ secrets.JARVIS_NEU_KEYSTORE_PASSWORT }}
          JARVIS_NEW_KEY_PASS: ${{ secrets.JARVIS_NEU_KEYSTORE_PASSWORT }}
          JARVIS_OLD_KS_PASS: ${{ secrets.JARVIS_ALT_KEYSTORE_PASSWORT }}
          JARVIS_OLD_KEY_PASS: ${{ secrets.JARVIS_ALT_KEYSTORE_PASSWORT }}
        run: |
          set -Eeuo pipefail
          umask 077
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          test -n "$apksigner_bin"
          export PATH="$(dirname "$apksigner_bin"):$PATH"
          export JARVIS_NEW_KEYSTORE="$RUNNER_TEMP/neu.p12" JARVIS_NEW_ALIAS=jarvis
          export JARVIS_OLD_KEYSTORE="$GITHUB_WORKSPACE/app/jarvis.keystore" JARVIS_OLD_ALIAS=jarvis
          printf '%s' "$KS_B64" | base64 -d > "$JARVIS_NEW_KEYSTORE"
          trap 'rm -f -- "$JARVIS_NEW_KEYSTORE"' EXIT
          export JARVIS_UNSIGNED_APK="$(find apks -name app-release-unsigned.apk | head -1)"
          export JARVIS_OUTPUT_APK="$GITHUB_WORKSPACE/Jarvis.apk" JARVIS_LINEAGE="$RUNNER_TEMP/lineage.bin"
          bash scripts/signierung/rotation-sign.sh
          bash scripts/signierung/apk-pruefen.sh Jarvis.apk release | tee -a "$GITHUB_STEP_SUMMARY"
          cp Jarvis.apk JarvisTest.apk

      - name: Als Release veröffentlichen
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Jarvis 1.0.${{ github.run_number }}
          make_latest: true
          files: Jarvis.apk
          body: |
            Jarvis.apk herunterladen und installieren – wird über die vorherige Version installiert.
            Im Emulator getestet: installiert, gestartet, bedient, kein Absturz.

      # Test-App eines Arbeitszweigs: eigene Vorab-Version „test-<Zweig>“. Wird nie als „neueste Version“
      # markiert – der normale Download-Link (latest) zeigt weiter auf die main-App.
      - name: Test-App veröffentlichen
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: test-${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          # Die Build-Nummer im Namen liest die App, um auf eine neuere Version hinzuweisen (UpdateCheck).
          name: Jarvis Test (Zweig ${{ github.ref_name }}, Build ${{ github.run_number }})
          prerelease: true
          make_latest: false
          files: JarvisTest.apk
          body: |
            Test-App vom Arbeitszweig „${{ github.ref_name }}“, im Emulator getestet (installiert, gestartet,
            bedient, kein Absturz). Installiert sich NEBEN der normalen Jarvis-App (eigenes Symbol „Jarvis Test“,
            eigene Einstellungen) und überschreibt sie nicht.
            Bitte immer nur eine der beiden Apps einschalten – sonst reagieren beide auf das Wachwort.
