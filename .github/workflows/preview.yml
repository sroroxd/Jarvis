name: Design-Vorschau

# Startet die App auf Arbeitszweigen in einem Android-Emulator und macht Bildschirmfotos
# von Startbildschirm und Einstellungen. Die Bilder landen in der Vorab-Version „vorschau“
# (wird nie als „neueste Version“ markiert – der APK-Link bleibt unberührt).
on:
  push:
    branches-ignore: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Debug-APK bauen
        run: gradle --no-daemon assembleDebug

      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Im Emulator fotografieren
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/screenshots.sh

      - name: Bilder hochladen
        uses: softprops/action-gh-release@v3
        with:
          tag_name: vorschau
          name: Design-Vorschau (nicht installieren)
          prerelease: true
          make_latest: false
          files: |
            shots/*.png
            shots/crash.txt
          body: |
            Automatische Bildschirmfotos vom Arbeitsstand „${{ github.ref_name }}“. Keine App zum Installieren.
