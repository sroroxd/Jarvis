name: JARVIS Neubau – unabhängiger Sprachkanal

on:
  push:
    branches: [ 'neustart/**' ]
    paths:
      - 'neubau/**'
      - '.github/workflows/neubau-sprachkern.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neubau:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Automatische Tests und eigene Debug-APK
        run: gradle --no-daemon -p neubau :app:testDebugUnitTest :app:assembleDebug
      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Neubau-Audio-Test-APK
          retention-days: 14
          if-no-files-found: error
          path: neubau/app/build/outputs/apk/debug/app-debug.apk

  starttest:
    needs: neubau
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
      - name: Debug-APK holen
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-Neubau-Audio-Test-APK
          path: apk
      - name: Emulatorbeschleunigung
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: App installieren und Startbild prüfen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install apk/app-debug.apk
            adb shell input keyevent 82
            adb shell am start -W -n de.art.jarvis.neubau/.MainActivity
            sleep 3
            adb shell pidof de.art.jarvis.neubau
            adb shell uiautomator dump /sdcard/window.xml
            adb shell cat /sdcard/window.xml | grep -q 'JARVIS'
