name: JARVIS Neubau – unabhängiger Sprachkanal

on:
  push:
    branches: [ 'neustart/**' ]
    paths:
      - 'neubau/**'
      - '.github/workflows/neubau-sprachkern.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neubau:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Automatische Tests und eigene Debug-APK
        run: gradle --no-daemon -p neubau :app:testDebugUnitTest :app:assembleDebug
      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Neubau-Audio-Test-APK
          retention-days: 14
          if-no-files-found: error
          path: neubau/app/build/outputs/apk/debug/app-debug.apk
